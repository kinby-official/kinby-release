name: Build Client
on:
  workflow_dispatch:
    inputs:
      ref: 
        description: "The ref to build"
        required: true
        default: main
        type: string
      debug:
        description: "launch tmate session on failure"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - name: Setup session
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30